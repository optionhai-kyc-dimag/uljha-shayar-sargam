<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARGAM Bike Spare Parts</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding-bottom: 60px; }
        .banner { width: 100%; border-bottom: 3px solid #ff0000; }
        .search-bar { padding: 15px; }
        .search-bar input { width: 100%; padding: 12px; border-radius: 20px; border: none; background: #333; color: white; }
        
        /* Product Grid */
        .product-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .product-card { background: #1e1e1e; padding: 10px; border-radius: 10px; text-align: center; }
        .product-card img { width: 100%; height: 100px; object-fit: contain; }
        
        /* Fixed Bottom Nav */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #000; padding: 10px 0; border-top: 1px solid #333; }
        .nav-btn { color: white; text-decoration: none; font-size: 12px; text-align: center; }
        
        /* Contact & Pay Buttons */
        .btn-green { background: #25d366; color: white; padding: 10px; border-radius: 5px; text-decoration: none; display: block; margin-top: 5px; }
        .btn-blue { background: #007bff; color: white; padding: 10px; border-radius: 5px; text-decoration: none; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <img src="https://i.ibb.co/n6fV8zG/1000499304.png" class="banner">

    <!-- Search -->
    <div class="search-bar">
        <input type="text" placeholder="Search items, categories...">
    </div>

    <!-- Product Example -->
    <div class="product-list">
        <div class="product-card">
            <img src="https://via.placeholder.com/100" alt="Part">
            <h4>COUPLING RUBBER</h4>
            <a href="https://wa.me/917531918790" class="btn-green">Order on WhatsApp</a>
        </div>
        <!-- Aap isi tarah aur product card niche add kar sakte hain -->
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bottom">
        <a href="#" class="nav-btn">🏠 Home</a>
        <a href="#" class="nav-btn">📦 Products</a>
        <a href="tel:+919120747491" class="nav-btn">📞 Call</a>
        <a href="https://wa.me/917531918790" class="nav-btn">💬 WhatsApp</a>
    </div>

</body>
</html>
